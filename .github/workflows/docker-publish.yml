name: docker-publish

# Build the production image and push it to GHCR on every push to main.
# Image tag = commit short-SHA (pinned versions everywhere — no "latest").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write   # comment the release command on the merged PR

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        # --short=8 pinned: the tag is always the first 8 chars of the sha, so
        # it can be derived from any commit listing without asking git.
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # Runs only after the push succeeded, so the comment doubles as the
      # "image is ready" signal. Direct pushes to main have no PR — skipped.
      - name: Comment release command on the merged PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            # fenced blocks (not inline code) so GitHub renders a copy button
            body="📦 Image published: \`ghcr.io/${{ github.repository }}:${TAG}\`

          Deploy:
          \`\`\`bash
          ./release.sh ${TAG}
          \`\`\`"
            # previous main head = the previous build's tag; the usual rollback
            # target, but releases.log on the server is what's actually live
            prev=$(echo "$BEFORE" | cut -c1-8)
            if [ -n "$prev" ] && [ "$prev" != "00000000" ]; then
              body="$body

          Rollback (previous build):
          \`\`\`bash
          ./release.sh ${prev}
          \`\`\`"
            fi
            gh pr comment "$pr" -R "${{ github.repository }}" --body "$body"
          else
            echo "no PR associated with ${{ github.sha }}, skipping comment"
          fi
